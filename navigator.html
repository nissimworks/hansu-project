<html lang="en">
<head>
<meta charset="utf-8">

<title>Free Startup Support Navigator | 무료 스타트업 지원 내비게이터</title>
<meta name="description" content="Answer five questions and see the Busan and Korean startup programs you qualify for. Free, no sign-up, no data collected.">
<style>
:root{--navy:#2E7D6E;--navy2:#3C8A7B;--amber:#A03A5F;--amber-l:#F6E4EA;--cream:#FBF5E9;--ink:#1C1B1A;
--muted:#5E5751;--teal:#2E6E6A;--line:#E4DAC6;--white:#fff;--ok:#2E6E6A;--soon:#B4762A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);
font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,"Segoe UI",Roboto,sans-serif;
font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff;padding:18px 0 14px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:#256C5F}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff;padding:1px}
.brand b{font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand span{display:block;font-size:10.5px;color:#F0D3DE;letter-spacing:.16em;font-weight:700}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#EAF3EF;font:inherit;font-size:12.5px;padding:6px 12px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
.intro{padding:30px 0 8px}
.intro h1{font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;font-size:clamp(25px,4.4vw,36px);line-height:1.24;margin:0 0 8px;color:var(--navy)}
.intro p{margin:0;color:var(--muted);max-width:720px}
.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 20px 8px;margin:20px 0 8px;
box-shadow:0 4px 24px rgba(14,42,71,.06)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.field{min-width:0}
.field.full{grid-column:1/-1}
label.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
select,input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
font:inherit;font-size:14.5px;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--amber);outline-offset:1px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stage{border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;cursor:pointer;background:#FCFAF4;transition:.15s}
.stage:hover{border-color:var(--navy2)}
.stage input{position:absolute;opacity:0;pointer-events:none}
.stage .t{font-weight:700;font-size:13px;color:var(--navy);display:block}
.stage .s{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.stage.sel{border-color:var(--amber);background:#FFF9EF;box-shadow:inset 0 0 0 1px var(--amber)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:hover{opacity:.92}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.results{padding:6px 0 40px}
.grouphead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.grouphead h2{font-family:"Nanum Myeongjo",Georgia,serif;font-size:20px;color:var(--navy);margin:0}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--amber-l);color:#7A2A45}
.pill.green{background:#DCEDE7;color:#255F54}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative}
.card.top{border-left:4px solid var(--ok)}
.card.soon{border-left:4px solid var(--soon);background:#FFFCF6}
.chead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.chead h3{margin:0;font-size:16.5px;color:var(--navy);line-height:1.35}
.org{font-size:12px;color:var(--muted);margin-top:2px}
.amount{font-family:"Nanum Myeongjo",Georgia,serif;font-size:16px;font-weight:700;color:var(--teal);white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2.5px 8px;border-radius:999px;background:#DCEDE7;color:var(--navy);margin-right:5px}
.tag.b{background:var(--amber-l);color:#7A2A45}
.chips{margin:9px 0 0}
.why{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.why li{font-size:11.5px;background:#EFF6F3;border-radius:999px;padding:3px 9px;color:#255F54}
.why li.warn{background:#F6E4EA;color:#7A2A45}
.detail{margin:10px 0 0;font-size:13.5px}
.detail ul{margin:6px 0 0;padding-left:18px}
.detail li{margin:2px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px;margin:10px 0 0;font-size:12.3px;color:var(--muted)}
.meta div b{color:var(--ink);font-weight:700}
.links{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.links a{color:var(--teal);font-weight:700;text-decoration:none;border-bottom:1px solid rgba(46,110,106,.35)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted)}
.cta{background:var(--navy);color:#fff;border-radius:18px;padding:22px 24px;margin:26px 0 0}
.cta h3{font-family:"Nanum Myeongjo",Georgia,serif;margin:0 0 6px;font-size:19px}
.cta p{margin:0;color:#EAF3EF;font-size:13.5px}
.cta a{color:var(--amber);font-weight:700;text-decoration:none}
footer{border-top:1px solid var(--line);padding:18px 0 34px;font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:760px){
  .fgrid{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(2,1fr)}
  .count{margin-left:0;width:100%}
  .amount{font-size:15px}
}
@media print{
  header,.form,.cta,.actions{display:none!important}
  body{background:#fff}.card{break-inside:avoid}
}
</style>

.hansu-back a{color:#fff;font-weight:600;text-decoration:none}
.hansu-back a:hover{color:#C8D96F}
.hansu-back .home{font-weight:700}
.hansu-back .links{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.hansu-back .links a[aria-current="page"]{color:#C8D96F}

      <input type="radio" name="stage" value="${s.id}" ${stage===s.id?'checked':''}>

  document.querySelectorAll(".stage").forEach(el=>el.addEventListener("click",()=>{
    stage = el.dataset.id;
    document.querySelectorAll(".stage").forEach(x=>x.classList.toggle("sel", x.dataset.id===stage));
  }));

  const loc = document.getElementById("loc");
  const prevLoc = loc.value || "busan";
  loc.innerHTML = t.locs.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  loc.value = prevLoc;
  const dist = document.getElementById("dist");
  const prevDist = dist.value || "any";
  dist.innerHTML = `<option value="any">${t.distAny}</option>` + t.districts.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  dist.value = prevDist;
  const df = document.getElementById("distField");
  const toggleDist = ()=>{ df.style.display = (loc.value==="busan") ? "" : "none"; };
  loc.onchange = toggleDist; toggleDist();

  ind.innerHTML = INDUSTRIES.map(i=>`<option value="${i.id}">${lang==='en'?i.en:i.ko}</option>`).join("");
  ind.value = prevInd;

  buildForm();
}

function evaluate(p, u){
  const reasons = [], warns = [];
  if(!p.stages.includes(u.stage)) return null;
  if(u.age < 16 || u.age > 90) return null;

  if(p.min_age && u.age < p.min_age){
    if(p.min_age - u.age <= 6) warns.push({k:"age", v:p.min_age});
    else return null;
  }
  if(p.max_age && u.age > p.max_age) return null;

  const inKorea = u.loc !== "abroad";
  let regionOk = false;
  if(p.abroad_ok) regionOk = true;
  else if(p.regions.includes("korea")) regionOk = inKorea;
  else if(p.regions.includes("bugyeong")) regionOk = (u.loc==="busan" || u.loc==="bugyeong");
  else if(p.regions.includes("busan")) regionOk = u.loc==="busan";

  if(!regionOk){
    if(u.loc==="abroad" && p.regions.includes("korea")) warns.push({k:"move"});
    else return null;
  }

  if(p.student_only && !u.student) return null;
  if(p.restart_only && !u.restart) return null;
  if(p.foreign_only && u.status === "korean") return null;
  if(p.needs_investment) warns.push({k:"invest"});
  if(p.districts){
    if(u.district === "any") warns.push({k:"district", v:p.districts});
    else if(!p.districts.includes(u.district)) return null;
  }
  if(!(p.industries.includes("any") || p.industries.includes(u.industry) || u.industry==="any")) return null;
  if(p.women_only && !u.woman) return null;
  if(p.tier === "sector" && u.industry === "any") warns.push({k:"sector"});

  if(u.status !== "korean"){
    if(p.foreign === "no") return null;
    if(p.foreign === "entity"){
      if(u.status === "foreign_abroad") warns.push({k:"entity"});
      else reasons.push("foreignEntity");
    } else if(p.foreign === "yes") reasons.push("foreign");
  }
  if(p.women_only) reasons.push("woman");
  if(p.regions.includes("busan") && u.loc==="busan") reasons.push("busan");
  if(p.regions.includes("bugyeong")) reasons.push("bugyeong");
  if(p.regions.includes("korea") && inKorea) reasons.push("korea");
  if(p.min_age && u.age >= p.min_age) reasons.push("ageMin");
  if(!p.industries.includes("any") && u.industry !== "any") reasons.push("ind");
  reasons.push("stage");

  return {p, reasons, warns, status: warns.length ? "almost" : "qualify"};
}

function labelFor(p){
  const q = lang==="en" ? (p.name_en + "@@" + p.org_en) : (p.name_ko + "@@" + p.org_ko);
  return q.split("@@");
}

  const t = T[lang], p = r.p;
  const [name, org] = labelFor(p);
  const amount = lang==="en" ? p.amount_en : p.amount_ko;
  const support = lang==="en" ? p.support_en : p.support_ko;
  const win = lang==="en" ? p.window_en : p.window_ko;
  const apply = lang==="en" ? p.apply_en : p.apply_ko;
  const note = lang==="en" ? p.note_en : p.note_ko;
  const tierTag = p.tier==="busan" ? (lang==="en"?"Busan":"부산") : (p.tier==="sector"?(lang==="en"?"Sector":"분야별"):(lang==="en"?"National":"국가"));
  const why = r.reasons.map(k=>{
    if(k==="stage") return `<li>${t.whyStage[p.stages[0]]||t.whyStage.early}</li>`;
    if(k==="busan") return `<li>${t.whyBusan}</li>`;
    if(k==="bugyeong") return `<li>${t.whyBugyeong}</li>`;
    if(k==="korea") return `<li>${t.whyKorea}</li>`;
    if(k==="ageMin") return `<li>${t.whyAgeMin(p.min_age)}</li>`;
    if(k==="foreign") return `<li>${t.whyForeign}</li>`;
    if(k==="foreignEntity") return `<li>${t.whyForeignEntity}</li>`;
    if(k==="woman") return `<li>${t.whyWoman}</li>`;
    if(k==="ind") return `<li>${t.whyInd}</li>`;
    return "";
  }).join("");
  const warns = r.warns.map(w=>{
    if(w.k==="age") return `<li class="warn">${t.warnAge(w.v)}</li>`;
    if(w.k==="entity") return `<li class="warn">${t.warnEntity}</li>`;
    if(w.k==="move") return `<li class="warn">${t.warnMove}</li>`;
    if(w.k==="sector") return `<li class="warn">${t.warnSector}</li>`;
    if(w.k==="invest") return `<li class="warn">${t.warnInvest}</li>`;
    if(w.k==="district"){
      const names = (w.v||[]).map(d=>{const f=t.districts.find(x=>x[0]===d); return f?f[1]:d;}).join(", ");
      return `<li class="warn">${t.warnDistrict(names)}</li>`;
    }
    return "";
  }).join("");
  return `<article class="card ${r.status==='qualify'?'top':'soon'}">
    <div class="chead">
      <div><h3>${name}</h3><div class="org">${org}</div></div>
      <div class="amount">${amount}</div>
    </div>
    <div class="chips"><span class="tag ${p.tier==='busan'?'b':''}">${tierTag}</span></div>
    <ul class="why">${why}${warns}</ul>
    <div class="detail"><b>${t.support}:</b><ul>${support.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="meta">
      <div><b>${t.lblWindow}</b><br>${win}</div>
      <div><b>${t.lblApply}</b><br>${apply}</div>
      <div><b>${t.lblContact}</b><br>${p.contact}</div>
    </div>
    <div class="links"><a href="${p.url}" target="_blank" rel="noopener">${t.applyLink} &#8599;</a></div>
    <p class="note">${note} ${t.note}</p>
  </article>`;
}

function run(initial){
  hasRun = true;
  const u = {
    stage: stage,
    age: parseInt(document.getElementById("age").value||"32",10),
    loc: document.getElementById("loc").value,
    status: document.getElementById("status").value,
    industry: document.getElementById("ind").value,
    woman: document.getElementById("woman").checked,
    student: document.getElementById("student").checked,
    restart: document.getElementById("restart").checked,
    district: document.getElementById("dist").value
  };
  const out = [];
  PROGRAMS.forEach(p=>{
    const r = evaluate(p,u);
    if(r) out.push(r);
  });
  const order = {busan:0, national:1, sector:2};
  out.sort((a,b)=>{
    if(a.status!==b.status) return a.status==="qualify"?-1:1;
    if(order[a.p.tier]!==order[b.p.tier]) return order[a.p.tier]-order[b.p.tier];
    return 0;
  });
  const qual = out.filter(r=>r.status==="qualify");
  const almost = out.filter(r=>r.status==="almost");
  const t = T[lang];
  document.getElementById("count").textContent = out.length ? t.count(qual.length, almost.length) : "";

  let html = "";
  if(!out.length){
    html = `<div class="empty">${t.empty}</div>`;
  } else {
    if(qual.length){
      html += `<div class="grouphead"><h2>${t.gQualify}</h2><span class="pill green">${qual.length}</span></div><div class="cards">${qual.map(cardHtml).join("")}</div>`;
    }
    if(almost.length){
      html += `<div class="grouphead"><h2>${t.gAlmost}</h2><span class="pill">${almost.length}</span></div><div class="cards">${almost.map(cardHtml).join("")}</div>`;
    }
  }
  document.getElementById("results").innerHTML = html;
  if(!initial) document.getElementById("results").scrollIntoView({behavior:"smooth", block:"start"});
}

function resetAll(){
  stage = "early";
  document.getElementById("age").value = 32;
  document.getElementById("loc").value = "busan";
  document.getElementById("status").value = "korean";
  document.getElementById("ind").value = "any";
  document.getElementById("woman").checked = false;
  document.getElementById("student").checked = false;
  document.getElementById("restart").checked = false;
  document.getElementById("dist").value = "any";
  document.querySelectorAll(".stage").forEach(x=>x.classList.toggle("sel", x.dataset.id===stage));
  document.getElementById("results").innerHTML = "";
  document.getElementById("count").textContent = "";
  hasRun = false;
  window.scrollTo({top:0, behavior:"smooth"});
}

buildForm();
setTimeout(()=>run(true), 250);
</script>
</body>
</html>
